name: AYUSARTHI CI

on:
  push:
    branches: ["main", "repair-frontend-backend-repo"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt Pillow

      - name: Compile Python sources
        run: python -m compileall backend frontend streamlit_app.py tests

      - name: Run tests
        run: python -m unittest discover -s tests -v
