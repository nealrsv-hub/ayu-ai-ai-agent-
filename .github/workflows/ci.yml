name: AYUSARTHI CI

on:
  push:
    branches: ["main", "repair-frontend-backend-repo", "portfolio-audit-2026-10-17"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-demo.txt

      - name: Compile Python sources
        run: python -m compileall -q backend frontend scripts streamlit_app.py tests judge_submission

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check and build judge package
        run: |
          python -m scripts.build_judge_bundle --check
          python -m scripts.build_judge_bundle

      - name: Exercise the simulated backend
        run: python -m scripts.check_demo --output dist/demo-check.json

      - name: Record tested dependencies
        run: python -m pip freeze > dist/installed.txt

      - name: Audit tested dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r dist/installed.txt --no-deps --disable-pip --strict --format json --output dist/dependency-audit.json

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayusarthi-${{ matrix.os }}
          path: |
            dist/AYUSARTHI-judge.zip
            dist/demo-check.json
            dist/installed.txt
            dist/dependency-audit.json
          retention-days: 14
